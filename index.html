<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSRSSHSC</title>
<style>
:root {
  color-scheme: dark;
  --bg: #14110e;
  --panel: #231e19;
  --panel-2: #2c261f;
  --sticky: #231e19;
  --line: #4a3f33;
  --text: #f4ecdc;
  --muted: #cbbba4;
  --gold: #f0c96a;
  --gold-dim: #a6843d;
  --danger: #ffb4a8;
  --ok: #b7d7a8;
  --shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.45;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 28px 16px 48px; }
.title-row {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 8px 14px;
  margin: 0 0 8px;
}
header h1 { margin: 0; font-size: 1.7rem; letter-spacing: 0.01em; }
.title-row a, .what { color: var(--gold); font-weight: 650; text-underline-offset: 2px; }
.panel {
  margin-top: 18px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  box-shadow: var(--shadow);
}
.panel h2 { margin: 0 0 4px; font-size: 1.15rem; }
.status { min-height: 1.4em; color: var(--muted); margin: 8px 0 0; }
.status.error, .error { color: var(--danger); }
.row { display: flex; gap: 8px; align-items: end; }
.search-wrap { position: relative; flex: 1; }
label { display: block; font-size: 0.86rem; color: var(--muted); margin-bottom: 4px; }
input[type="text"], input[type="search"] {
  width: 100%;
  background: #120e0b;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 10px;
}
.hint { margin: 6px 0 0; color: var(--muted); font-size: 0.86rem; }
.icon-btn, .segment button, .text-btn {
  background: #120e0b;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 12px;
}
.segment { display: flex; flex-wrap: wrap; gap: 6px; }
.segment button[aria-pressed="true"], .text-btn[aria-pressed="true"] {
  border-color: var(--gold);
  color: var(--gold);
}
.results {
  position: absolute;
  z-index: 5;
  left: 0; right: 0; top: calc(100% + 4px);
  background: #1b1612;
  border: 1px solid var(--line);
  border-radius: 10px;
  max-height: 280px;
  overflow: auto;
  box-shadow: var(--shadow);
}
.results[hidden] { display: none; }
.results button {
  display: block;
  width: 100%;
  text-align: left;
  background: transparent;
  border: 0;
  border-bottom: 1px solid rgba(74, 63, 51, 0.6);
  padding: 8px 10px;
  border-radius: 0;
}
.results button.active, .results button:hover { background: #342b22; }
.results .meta { color: var(--muted); font-size: 0.82rem; }
.picked {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-top: 12px;
  padding: 10px;
  background: var(--panel-2);
  border-radius: 10px;
}
.picked[hidden] { display: none; }
.picked img { width: 36px; height: 36px; object-fit: contain; }
.picked .name { font-weight: 650; }
.badge {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 6px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: 0.75rem;
  font-weight: 600;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin-top: 14px;
}
.item-grid { grid-template-columns: repeat(4, minmax(0, 1fr)) auto; }
.label-with-help { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.label-with-help label { margin-bottom: 0; }
.help {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font-size: 0.72rem;
  font-weight: 700;
  line-height: 1;
}
.tip {
  display: none;
  position: absolute;
  left: 0;
  top: calc(100% + 8px);
  width: min(260px, 70vw);
  padding: 8px 10px;
  background: #120e0b;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--text);
  font-size: 0.78rem;
  font-weight: 450;
  letter-spacing: 0;
  text-transform: none;
  text-align: left;
  line-height: 1.4;
  z-index: 6;
}
.help:hover .tip, .help:focus .tip { display: block; }
@media (min-width: 901px) {
  .tip { left: auto; right: 0; }
}
@media (max-width: 900px) {
  .tip { top: auto; bottom: calc(100% + 8px); }
}
.refs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 14px;
}
.ref {
  background: var(--panel-2);
  border-radius: 10px;
  padding: 10px 12px;
}
.ref span, .ref label { display: block; color: var(--muted); font-size: 0.8rem; }
.ref strong { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.ref input { margin-top: 4px; font-size: 1.15rem; font-variant-numeric: tabular-nums; padding: 6px 8px; }
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: end;
  margin: 10px 0;
}
.toolbar .grow { flex: 1; min-width: 180px; }
.check {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}
.each-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 12px;
  align-items: center;
}
.check input { width: 1rem; height: 1rem; margin: 0; accent-color: var(--gold); }
.hop-sliders {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 8px 12px;
  align-items: center;
  margin: 4px 0 12px;
}
.hop-sliders label { color: var(--muted); font-size: 0.86rem; }
.hop-sliders label span { color: var(--gold); font-variant-numeric: tabular-nums; font-weight: 650; }
.hop-sliders input[type="range"] { width: 100%; margin: 0; accent-color: var(--gold); }
.each-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: end;
  margin: 0 0 8px;
}
.each-field { width: 9.5rem; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 0.92rem; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid rgba(74, 63, 51, 0.7); }
th { color: var(--muted); font-weight: 650; background: #1b1612; position: sticky; top: 0; }
th .sort {
  display: inline-flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 1px;
  padding: 0;
  border: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  font-weight: 650;
  cursor: pointer;
  text-align: right;
}
th .sort-label { display: inline-flex; align-items: center; gap: 4px; }
th .sort-arrow { color: var(--gold); font-size: 0.72rem; line-height: 1; }
th .sort:hover,
th[aria-sort="ascending"] .sort,
th[aria-sort="descending"] .sort { color: var(--text); }
.shop-col { position: sticky; left: 0; z-index: 1; text-align: left; background: var(--sticky); }
th.shop-col { z-index: 2; background: #1b1612; }
th.shop-col .sort { align-items: flex-start; text-align: left; }
.floor-flag { display: block; color: var(--gold-dim); font-size: 0.75rem; font-weight: 500; }
th .th-note, td.advice .advice-coins {
  display: block;
  color: var(--gold-dim);
  font-size: 0.72rem;
  font-weight: 600;
}
td.advice { line-height: 1.2; }
.detail {
  margin-top: 12px;
  margin-bottom: 20px;
  background: var(--panel-2);
  border-radius: 10px;
  padding: 12px;
}
.detail[hidden] { display: none; }
.detail h3 { margin: 0 0 6px; font-size: 1rem; }
.line-chart { position: relative; margin: 2px 0 8px; }
.line-chart svg { display: block; width: 100%; height: auto; cursor: crosshair; touch-action: pan-y; }
.line-chart.frozen svg { cursor: pointer; }
.line-chart.frozen .line-tip { border-color: var(--gold); }
.line-tip {
  position: absolute;
  z-index: 5;
  min-width: 9rem;
  padding: 8px 10px;
  background: #1b1612;
  border: 1px solid var(--gold-dim);
  border-radius: 8px;
  color: var(--text);
  font-size: 0.82rem;
  line-height: 1.35;
  pointer-events: none;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
  white-space: nowrap;
}
.line-tip[hidden] { display: none; }
.line-tip strong { display: block; color: var(--gold); font-weight: 650; }
.line-tip span { display: block; }
.line-tip .tip-line {
  display: flex;
  align-items: center;
  gap: 6px;
}
.line-tip .tip-line i {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex: 0 0 auto;
  background: var(--swatch);
}
.chart-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 8px;
  margin: 0 0 8px;
}
.chart-legend button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 8px;
  background: #120e0b;
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: 0.8rem;
}
.chart-legend i {
  width: 12px;
  height: 3px;
  border-radius: 2px;
  background: var(--swatch);
}
a.shop-name {
  color: inherit;
  font-weight: 650;
  text-decoration: underline;
  text-underline-offset: 2px;
}
a.shop-name:hover { color: var(--gold); }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: #2a241e; }
tbody tr.selected .shop-col { box-shadow: inset 3px 0 0 var(--row-color, var(--gold)); }
tbody tr.selected .shop-name { color: var(--row-color, var(--gold)); }
tbody tr:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
.note { color: var(--muted); font-size: 0.86rem; margin: 10px 0 0; }
footer { margin-top: 22px; color: var(--muted); font-size: 0.86rem; }
footer a { color: var(--gold); }
@media (max-width: 900px) {
  .item-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .gloves-field { grid-column: 1 / -1; }
}
@media (max-width: 720px) {
  .wrap { padding: 18px 12px 32px; }
  header h1 { font-size: 1.4rem; }
  .refs { grid-template-columns: 1fr; }
  .row { flex-direction: column; align-items: stretch; }
  .item-grid { grid-template-columns: 1fr; }
  .gloves-field { grid-column: auto; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-row">
      <h1>OSRS Shop Hop Sell Calculator</h1>
      <a href="https://github.com/f0nkey/osrs-sell-sim">GitHub</a>
    </div>
    <a class="what" href="https://github.com/f0nkey/osrs-sell-sim#osrs-shop-hop-sell-calculator">What is this?</a>
  </header>

  <section class="panel" aria-labelledby="item-heading">
    <h2 id="item-heading">Item</h2>
    <div class="row">
      <div class="search-wrap">
        <label for="item-search">Item name or id</label>
        <input id="item-search" type="search" autocomplete="off" spellcheck="false" placeholder="Loading items…" disabled role="combobox" aria-expanded="false" aria-controls="item-results" aria-autocomplete="list">
        <div id="item-results" class="results" role="listbox" hidden></div>
      </div>
      <button type="button" class="icon-btn" id="reload">Reload items</button>
    </div>
    <p id="status" class="status" role="status">Loading items from the wiki…</p>
    <div id="picked" class="picked" hidden></div>
    <div class="grid item-grid">
      <div>
        <label for="quantity">Total to sell</label>
        <input id="quantity" type="text" inputmode="numeric" value="1" autocomplete="off">
      </div>
      <div>
        <label for="hops-from">Hops minimum</label>
        <input id="hops-from" type="text" inputmode="numeric" value="1" autocomplete="off">
      </div>
      <div>
        <label for="hops-to">Hops maximum</label>
        <input id="hops-to" type="text" inputmode="numeric" value="10" autocomplete="off">
      </div>
      <div>
        <div class="label-with-help">
          <label for="stock">Current stock</label>
          <button type="button" class="help" aria-label="About current stock" aria-describedby="stock-tip">?
            <span class="tip" id="stock-tip" role="tooltip">If a general store already has some of this item, it pays less for yours. Each one in stock lowers the price by that shop's change percent, down to the 10% floor. Every hop starts from this same stock. A shop that lists the item uses the stock from the wiki instead of this number.</span>
          </button>
        </div>
        <input id="stock" type="text" inputmode="numeric" value="0" autocomplete="off">
      </div>
      <div class="gloves-field">
        <label id="gloves-label">Karamja gloves</label>
        <div class="segment" role="group" aria-labelledby="gloves-label">
          <button type="button" data-gloves="0" aria-pressed="true">None</button>
          <button type="button" data-gloves="1" aria-pressed="false">Gloves 1+</button>
          <button type="button" data-gloves="3" aria-pressed="false">Gloves 3+</button>
        </div>
      </div>
    </div>
    <div class="refs" id="refs">
      <div class="ref">
        <label for="item-value">Value</label>
        <input id="item-value" type="text" inputmode="numeric" value="" autocomplete="off" title="Shop prices use this number. Low and high alchemy stay the wiki prices.">
      </div>
      <div class="ref"><span>Low alchemy</span><strong id="ref-low">—</strong></div>
      <div class="ref"><span>High alchemy</span><strong id="ref-high">—</strong></div>
    </div>
    <p id="form-error" class="error" role="status"></p>
  </section>

  <section class="panel" aria-labelledby="general-heading">
    <h2 id="general-heading">Shops</h2>
    <p id="shop-status" class="note" role="status" hidden></p>
    <div class="toolbar">
      <div class="grow">
        <label for="shop-filter">Filter shops</label>
        <input id="shop-filter" type="search" placeholder="Shop or location" autocomplete="off">
      </div>
    </div>
    <p class="note">Click shops to add their lines to the chart. Click a highlighted shop to remove it.</p>
    <div class="hop-sliders">
      <label for="hops-from-slider">Hops minimum <span id="hops-from-readout">1</span></label>
      <input id="hops-from-slider" type="range" min="1" max="1" value="1">
      <label for="hops-to-slider">Hops maximum <span id="hops-to-readout">10</span></label>
      <input id="hops-to-slider" type="range" min="1" max="10" value="10">
    </div>
    <div id="shop-detail" class="detail" hidden></div>
    <div class="each-row">
      <div class="each-field">
        <label for="each-hop">Items each hop</label>
        <input id="each-hop" type="text" inputmode="numeric" value="" placeholder="Optional" autocomplete="off" title="Sell this many items every hop. Adds a column beside the hop columns and sorts shops by those coins.">
      </div>
      <div class="each-actions">
        <button type="button" class="text-btn" id="add-all-shops" title="Add every visible shop to the chart. Shops with the same buy percent, change percent, and stock share one line.">Add all to chart</button>
        <label class="check" for="hide-similar" title="Hide shops that share a buy percent and change percent. The shop that sorts first in each group stays.">
          <input id="hide-similar" type="checkbox" checked>
          Hide similar shops
        </label>
      </div>
    </div>
    <p id="each-error" class="error" role="status" hidden></p>
    <div class="table-wrap">
      <table aria-multiselectable="true">
        <thead id="shop-head"></thead>
        <tbody id="shop-body"></tbody>
      </table>
    </div>
  </section>

  <footer>
    <p>
      <a href="https://oldschool.runescape.wiki/w/Module:Shop_calculator">Module:Shop calculator</a>
      ·
      <a href="https://oldschool.runescape.wiki/w/Value#Actions_that_Turn_Items_to_Coins">Value</a>
      ·
      <a href="https://oldschool.runescape.wiki/w/General_store">General store</a>
      ·
      <a href="https://oldschool.runescape.wiki/w/Bucket:Storeline">Store lines</a>
      ·
      <a href="https://oldschool.runescape.wiki/w/Calculator:Shop_calculator">Shop calculator</a>
    </p>
  </footer>
</div>

function luaQuote(value) {
  return "'" + String(value).replace(/\\/g, "\\\\").replace(/'/g, "\\'") + "'";
}

function storelineQuery(itemName) {
  const select = STORELINE_FIELDS.map(function (field) { return "'" + field + "'"; }).join(",");
  return "bucket('storeline').select(" + select + ").where('sold_item', " + luaQuote(itemName) + ").limit(500).run()";
}

function plainShopName(name) {
  return String(name || "").replace(/\.+$/, "").trim().toLowerCase();
}

function wikiPlain(text) {
  return String(text || "")
    .replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g, "$2")
    .replace(/\[\[([^\]]+)\]\]/g, "$1")
    .replace(/'{2,}/g, "")
    .trim();
}

function tenthsToPercent(raw) {
  if (raw === null || raw === undefined || String(raw).trim() === "") return null;
  const n = Number(raw);
  if (!Number.isFinite(n)) return null;
  return n / 10;
}

function parseListedStock(raw) {
  const text = String(raw == null ? "" : raw).trim();
  if (text === "∞" || text.toLowerCase() === "inf") return Infinity;
  if (!/^\d+$/.test(text)) return null;
  return Number(text);
}

function shopBuysRow(row) {
  const price = String(row.store_buy_price == null ? "" : row.store_buy_price).trim();
  if (!price || price.toUpperCase() === "N/A") return false;
  return tenthsToPercent(row.store_buy_multiplier) !== null;
}

function parseStorelines(rows) {
  const shops = [];
  const seen = new Set();
  rows.forEach(function (row) {
    if (!shopBuysRow(row)) return;
    const buy = tenthsToPercent(row.store_buy_multiplier);
    const deltaRaw = tenthsToPercent(row.store_delta);
    const stock = parseListedStock(row.store_stock);
    const page = String(row.page_name || row.sold_by || "").trim();
    if (buy === null || deltaRaw === null || stock === null || !page) return;
    const note = String(row.store_notes || "").trim();
    const currency = String(row.store_currency || "Coins").trim() || "Coins";
    const infinite = stock === Infinity;
    const delta = infinite ? 0 : deltaRaw;
    let location = "";
    if (typeof row.sold_item_json === "string" && row.sold_item_json) {
      try {
        const parsed = JSON.parse(row.sold_item_json);
        if (parsed && parsed.Location) location = wikiPlain(parsed.Location);
      } catch (err) {
        location = "";
      }
    }
    const name = String(row.sold_by || page).trim() || page;
    const key = ["listed", page, note, String(buy), String(delta), String(stock), currency].join("\u001f");
    if (seen.has(key)) return;
    seen.add(key);
    shops.push({
      key: key,
      name: name,
      wikiTitle: page,
      location: location,
      buy: buy,
      delta: delta,
      baseStock: infinite ? 0 : stock,
      listed: true,
      unlimited: infinite,
      note: note,
      currency: currency,
      league: /league/i.test(note),
      floorNote: buy < 10 && currency === "Coins"
    });
  });
  return { shops: shops };
}

function coveredShopNames() {

  });
  return covered;
}

function generalStoreCovered(shop, covered) {

}

function beginShopLookup(item) {

  if (shopListingName === item.name && (shopListingState === "loading" || shopListingState === "ready")) return;
  const token = ++shopFetchToken;
  shopListingName = item.name;
  shopListings = [];
  shopListingState = "loading";
  fetchShopListings(item.name, token);
}

async function fetchShopListings(itemName, token) {
  try {
    const url = BUCKET_API + "?action=bucket&format=json&query=" + encodeURIComponent(storelineQuery(itemName));
    const response = await fetch(url);
    if (token !== shopFetchToken) return;
    if (!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();
    if (token !== shopFetchToken) return;
    if (!data || data.error || !Array.isArray(data.bucket)) throw new Error("Shop query failed");
    const parsed = parseStorelines(data.bucket);
    shopListings = parsed.shops;
    shopListingState = "ready";
  } catch (err) {
    if (token !== shopFetchToken) return;
    shopListings = [];
    shopListingState = "error";
  }
  updateAll();
}

function truncate(num) {
  return Math.trunc(num + 0.000001);
}

function safeMul(a, b) {
  if (!Number.isSafeInteger(a) || !Number.isSafeInteger(b)) return null;
  if (a === 0 || b === 0) return 0;
  if (a > Math.floor(MAX_SAFE / b)) return null;
  return a * b;
}

function priceBounds(opts) {
  const value = opts.value;
  const buy = opts.buyPercent / 100;
  return {
    value: value,
    buy: buy,
    delta: opts.deltaPercent / 100,
    baseStock: opts.baseStock,
    basePrice: truncate(value * buy),
    upper: truncate(value + buy * value),
    lower: truncate(value * 0.1)
  };
}

function priceAtStock(bounds, at) {
  let price;
  if (at < bounds.baseStock) price = truncate(bounds.value * (bounds.buy + bounds.delta * (bounds.baseStock - at)));
  else if (at === bounds.baseStock) price = bounds.basePrice;
  else price = truncate(bounds.value * (bounds.buy - bounds.delta * (at - bounds.baseStock)));
  if (price > bounds.upper) return bounds.upper;
  if (price <= bounds.lower) return bounds.lower;
  return price;
}

function sellVisit(opts) {
  const bounds = priceBounds(opts);
  const delta = bounds.delta;
  const lower = bounds.lower;
  const quantity = opts.quantity;
  let stock = opts.currentStock;
  let total = 0;
  let sold = 0;
  let first = null;
  let last = null;
  let hitFloor = false;
  const runs = [];
  let tail = null;
  let skipped = false;

  function addRun(price, count, start) {
    if (tail && tail.price === price && tail.end + 1 === start) {
      tail.end += count;
      tail.count += count;
      return;
    }
    const run = { price: price, start: start, end: start + count - 1, count: count };
    if (runs.length < LEAD_RUNS) runs.push(run);
    else skipped = true;
    tail = run;
  }

  while (sold < quantity) {
    const price = priceAtStock(bounds, stock);
    if (price === lower) hitFloor = true;
    const restFlat = delta === 0 || price === lower;
    const count = restFlat ? quantity - sold : 1;
    const chunk = safeMul(price, count);
    if (chunk === null || total > MAX_SAFE - chunk) {
      return { error: "That sale is too large to total exactly." };
    }
    total += chunk;
    if (first === null) first = price;
    last = price;
    addRun(price, count, sold + 1);
    sold += count;
    if (!restFlat) stock += 1;
  }

  return {
    total: total,
    first: first,
    last: last,
    runs: runs,
    tail: tail,
    skipped: skipped,
    hitFloor: hitFloor,
    lower: lower,
    quantity: quantity
  };
}

function withHops(visit, hops) {
  if (visit.error) return visit;
  const overall = safeMul(visit.total, hops);
  if (overall === null) return { error: "That sale is too large to total exactly." };
  return {
    perHop: visit.total,
    overall: overall,
    first: visit.first,
    last: visit.last,
    runs: visit.runs,
    tail: visit.tail,
    skipped: visit.skipped,
    hitFloor: visit.hitFloor,
    lower: visit.lower,
    quantity: visit.quantity
  };
}

function sellBatch(opts) {
  const bounds = priceBounds(opts);
  const start = opts.currentStock;
  const first = priceAtStock(bounds, start);
  if (first <= bounds.lower) {
    return { mode: "floor", count: 0, coins: 0, lower: bounds.lower, price: first };
  }
  if (bounds.delta === 0) {
    return { mode: "flat", count: null, coins: null, lower: bounds.lower, price: first };
  }
  const cap = 10000000;
  function above(n) {
    return priceAtStock(bounds, start + n - 1) > bounds.lower;
  }
  function finish(count, capped) {
    let coins = null;
    if (!capped && count > 0 && count <= 200000) {
      const visit = sellVisit({
        value: opts.value,
        buyPercent: opts.buyPercent,
        deltaPercent: opts.deltaPercent,
        baseStock: opts.baseStock,
        currentStock: opts.currentStock,
        quantity: count
      });
      if (!visit.error) coins = visit.total;
    }
    return {
      mode: "batch",
      count: count,
      coins: coins,
      lower: bounds.lower,
      price: first,
      capped: capped
    };
  }
  if (above(cap)) return finish(cap, true);
  let hi = 1;
  while (hi < cap && above(hi)) {
    const next = hi * 2;
    hi = next > cap ? cap : next;
  }
  let left = 1;
  let right = hi;
  while (left < right) {
    const mid = Math.ceil((left + right) / 2);
    if (above(mid)) left = mid;
    else right = mid - 1;
  }
  return finish(left, false);
}

function syncHopSliders() {

  if (limit > 10000000) limit = 10000000;
  const from = readWhole("hops-from");
  const to = readWhole("hops-to");
  let max = limit;
  if (from !== null && from > max) max = Math.min(from, 10000000);
  if (to !== null && to > max) max = Math.min(to, 10000000);
  [["hops-from", from], ["hops-to", to]].forEach(function (pair) {
    const slider = document.getElementById(pair[0] + "-slider");
    const value = pair[1] === null ? 1 : Math.min(Math.max(pair[1], 1), max);

  const limit = Number(toSlider.max);
  if (which === "hops-from" && from > to) to = from;
  if (which === "hops-to" && to < from) from = to;
  if (to - from > 1999) {

    else to = Math.min(limit, from + 1999);

function sampleTableHops(from, to, quantity) {
  const divisors = [];
  for (let hop = from; hop <= to; hop++) {
    if (quantity % hop === 0) divisors.push(hop);
  }
  if (divisors.length <= 10) return divisors;
  const picked = [];
  const last = divisors.length - 1;
  for (let i = 0; i <= 10; i++) {
    const hop = divisors[Math.round(last * i / 10)];
    if (picked.indexOf(hop) === -1) picked.push(hop);
  }
  return picked;
}

function rankItem(item, q) {
  const name = item.name.toLowerCase();
  const id = String(item.id);
  if (name === q) return 0;
  if (name.startsWith(q)) return 1;
  if (id === q) return 2;
  if (/^\d+$/.test(q) && id.startsWith(q)) return 3;
  return 4;
}

function matchingItems(query) {
  const q = query.trim().toLowerCase();
  if (!q) return [];
  const digits = /^\d+$/.test(q);
  const found = [];
  for (let i = 0; i < catalog.length; i++) {
    const item = catalog[i];
    const name = item.name.toLowerCase();
    const id = String(item.id);
    if (name.includes(q) || (digits && id.startsWith(q))) found.push(item);
  }
  found.sort(function (a, b) {
    const ra = rankItem(a, q);
    const rb = rankItem(b, q);
    if (ra !== rb) return ra - rb;
    return a.name.localeCompare(b.name);
  });
  return found.slice(0, 30);
}

}

function setActive(index) {

}

function coinNoun(count) {
  return formatCoins(count) + (count === 1 ? " coin" : " coins");
}

function moneyNoun(count, currency) {
  if (!currency || currency === "Coins") return coinNoun(count);
  return formatCoins(count) + " " + currency;
}

function itemsEachHop(entry) {
  if (entry.eachMax <= 0) return "0 items each hop";
  if (entry.eachMin === entry.eachMax) return itemNoun(entry.eachMax) + " each hop";
  return formatCoins(entry.eachMin) + "–" + formatCoins(entry.eachMax) + " items each hop";
}

function visitFor(priceOpts, qty, cache) {
  if (qty <= 0) return { total: 0 };
  if (cache.has(qty)) return cache.get(qty);
  const visit = sellVisit(Object.assign({ quantity: qty }, priceOpts));
  cache.set(qty, visit);
  return visit;
}

function stackPlan(advice, total, priceOpts, cache) {
  const perHop = advice.mode === "batch" ? Math.min(advice.count, total) : total;
  const visit = visitFor(priceOpts, perHop, cache);
  if (visit.error) return { error: visit.error };
  const remainder = total % perHop;
  const fullHops = Math.floor(total / perHop);
  let coins = safeMul(visit.total, fullHops);
  if (coins === null) return { error: "That sale is too large to total exactly." };
  let remainderCoins = 0;
  if (remainder > 0) {
    const remVisit = visitFor(priceOpts, remainder, cache);
    if (remVisit.error) return { error: remVisit.error };
    remainderCoins = remVisit.total;
    if (coins > MAX_SAFE - remainderCoins) return { error: "That sale is too large to total exactly." };
    coins += remainderCoins;
  }
  return {
    perHop: perHop,
    hopsNeeded: fullHops + (remainder > 0 ? 1 : 0),
    remainder: remainder,
    coins: coins,
    hopCoins: visit.total,
    remainderCoins: remainderCoins,
    visit: visit,
    mode: advice.mode,
    lower: advice.lower,
    price: advice.price,
    atEdge: advice.mode === "batch" && !advice.capped && perHop === advice.count
  };
}

function spreadSale(priceOpts, total, hops, cache) {
  const base = Math.floor(total / hops);
  const extra = total % hops;
  let coins = 0;
  if (extra > 0) {
    const visit = visitFor(priceOpts, base + 1, cache);
    if (visit.error) return { error: visit.error };
    const part = safeMul(visit.total, extra);
    if (part === null) return { error: "That sale is too large to total exactly." };
    coins = part;
  }
  if (base > 0) {
    const visit = visitFor(priceOpts, base, cache);
    if (visit.error) return { error: visit.error };
    const part = safeMul(visit.total, hops - extra);
    if (part === null || coins > MAX_SAFE - part) return { error: "That sale is too large to total exactly." };
    coins += part;
  }
  return {
    hops: hops,
    total: coins,
    eachMin: base,
    eachMax: extra > 0 ? base + 1 : base,
    highCount: extra,
    lowCount: hops - extra
  };
}

function eachText(spread) {
  if (spread.eachMax <= 0) return "0 each";
  if (spread.eachMin === 0 || spread.eachMin === spread.eachMax) return formatCoins(spread.eachMax) + " each";
  return formatCoins(spread.eachMin) + "–" + formatCoins(spread.eachMax) + " each";
}

function itemNoun(count) {
  return formatCoins(count) + (count === 1 ? " item" : " items");
}

function spreadTitle(spread) {
  const paid = " That pays " + formatCoins(spread.total) + " coins.";
  function sells(count, items) {
    return hopLabel(count) + (count === 1 ? " sells " : " sell ") + itemNoun(items);
  }
  if (spread.eachMin === spread.eachMax) {
    return "Each of " + hopLabel(spread.hops) + " sells " + itemNoun(spread.eachMin) + "." + paid;
  }
  if (spread.eachMin === 0) {
    return sells(spread.highCount, spread.eachMax) + ". The other hops sell nothing." + paid;
  }
  return sells(spread.highCount, spread.eachMax) + ", and " + sells(spread.lowCount, spread.eachMin) + "." + paid;
}

function eachPlan(total, each) {
  const per = Math.min(each, total);
  const full = Math.floor(total / per);
  const rem = total % per;
  return { per: per, full: full, rem: rem, hops: full + (rem > 0 ? 1 : 0) };
}

function eachHopSale(priceOpts, total, each) {
  const plan = eachPlan(total, each);
  const cache = new Map();
  const visit = visitFor(priceOpts, plan.per, cache);
  if (visit.error) return visit;
  let coins = safeMul(visit.total, plan.full);
  if (coins === null) return { error: "That sale is too large to total exactly." };
  if (plan.rem > 0) {
    const remVisit = visitFor(priceOpts, plan.rem, cache);
    if (remVisit.error) return remVisit;
    if (coins > MAX_SAFE - remVisit.total) return { error: "That sale is too large to total exactly." };
    coins += remVisit.total;
  }
  return {
    per: plan.per,
    hops: plan.hops,
    full: plan.full,
    rem: plan.rem,
    total: coins
  };
}

function eachHeaderTitle() {
  const stack = itemNoun(tableEachStack);
  const per = itemNoun(tableEach);
  if (tableEachRem > 0) {
    return "Coins for selling " + stack + " at " + per + " each hop. That is " + hopLabel(tableEachFull) + " of " + formatCoins(tableEach) + " and one hop of " + formatCoins(tableEachRem) + ". Every hop starts from the same stock.";
  }
  return "Coins for selling " + stack + " at " + per + " on each of " + hopLabel(tableEachHops) + ". Every hop starts from the same stock.";
}

function eachCellTitle(sale, currency) {
  let body;
  if (sale.rem > 0) {
    body = hopLabel(sale.full) + " sell " + itemNoun(sale.per) + ", and one hop sells " + itemNoun(sale.rem) + ".";
  } else {
    body = "Each of " + hopLabel(sale.hops) + " sells " + itemNoun(sale.per) + ".";
  }
  return body + " That pays " + moneyNoun(sale.total, currency) + ".";
}

function buildSale(priceOpts, total, hops) {
  const cache = new Map();
  const plan = stackPlan(sellBatch(priceOpts), total, priceOpts, cache);
  if (plan.error) return plan;
  const spreads = [];
  for (let i = 0; i < hops.length; i++) {
    const spread = spreadSale(priceOpts, total, hops[i], cache);
    if (spread.error) return { error: spread.error };
    spread.each = eachText(spread);
    spreads.push(spread);
  }
  return {
    plan: plan,
    spreads: spreads,
    quote: {
      perHop: plan.hopCoins,
      first: plan.visit.first,
      last: plan.visit.last,
      runs: plan.visit.runs,
      tail: plan.visit.tail,
      skipped: plan.visit.skipped,
      hitFloor: plan.visit.hitFloor,
      lower: plan.visit.lower,
      quantity: plan.perHop
    }
  };
}

function ensureSeries(row) {
  if (row.series) return row.series;
  if (row.spreads.length === row.hopTo - row.hopFrom + 1) {
    row.series = row.spreads;
    return row.series;
  }
  const cache = new Map();
  const spreads = [];
  for (let hops = row.hopFrom; hops <= row.hopTo; hops++) {
    const spread = spreadSale(row.priceOpts, row.total, hops, cache);
    if (spread.error) {
      row.seriesError = spread.error;
      return null;
    }
    spread.each = eachText(spread);
    spreads.push(spread);
  }
  row.series = spreads;
  return spreads;
}

function svgEl(name, attrs) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", name);
  Object.keys(attrs).forEach(function (key) {
    el.setAttribute(key, attrs[key]);
  });
  return el;
}

function renderLineChart(lines, hopFrom, hopTo) {
  const viewW = 760;
  const viewH = 286;
  const padR = 18;
  const padT = 34;
  const padB = 48;
  const max = lines.reduce(function (peak, line) {
    return line.series.reduce(function (best, entry) { return Math.max(best, entry.total); }, peak);
  }, 0);
  const yMax = max === 0 ? 1 : max;
  const yTicks = [];
  for (let i = 0; i <= 4; i++) {
    const value = Math.round((max * i) / 4);
    if (!yTicks.length || yTicks[yTicks.length - 1] !== value) yTicks.push(value);
  }
  if (yTicks[yTicks.length - 1] !== max) yTicks.push(max);
  const padL = yTicks.reduce(function (wide, value) {
    return Math.max(wide, formatCoins(value).length * 7 + 16);
  }, 52);
  const plotW = viewW - padL - padR;
  const plotH = viewH - padT - padB;

  function xOf(hops) {
    if (hopTo === hopFrom) return padL + plotW / 2;
    return padL + ((hops - hopFrom) / (hopTo - hopFrom)) * plotW;
  }
  function yOf(total) {
    return padT + (1 - total / yMax) * plotH;
  }
  function num(n) {
    return String(Math.round(n * 10) / 10);
  }

  const svg = svgEl("svg", {
    viewBox: "0 0 " + viewW + " " + viewH,
    role: "img",
    "aria-label": "Total profit by hop count, from " + hopLabel(hopFrom) + " to " + hopLabel(hopTo) + ", for " + lines.map(function (line) { return line.name; }).join(", ") + ". Hover to see the hops, items each hop, and total profit. Click to pin that readout."
  });
  svg.append(svgEl("rect", { x: "0", y: "0", width: String(viewW), height: String(viewH), fill: "transparent" }));

  yTicks.forEach(function (value) {
    const y = yOf(value);
    svg.append(svgEl("line", {
      x1: String(padL),
      x2: String(padL + plotW),
      y1: num(y),
      y2: num(y),
      stroke: "#4a3f33",
      "stroke-width": value === 0 ? "1.5" : "1"
    }));
    const label = svgEl("text", {
      x: String(padL - 8),
      y: num(y + 4),
      fill: "#cbbba4",
      "font-size": "11",
      "text-anchor": "end"
    });
    label.textContent = formatCoins(value);
    svg.append(label);
  });

  const xTicks = [];
  const span = hopTo - hopFrom;
  const parts = span === 0 ? 0 : span <= 6 ? span : 4;
  for (let i = 0; i <= parts; i++) {
    const hop = span === 0 ? hopFrom : hopFrom + Math.round(span * i / parts);
    if (!xTicks.length || xTicks[xTicks.length - 1] !== hop) xTicks.push(hop);
  }
  xTicks.forEach(function (hop, index) {
    const x = xOf(hop);
    const anchor = index === 0 ? "start" : index === xTicks.length - 1 ? "end" : "middle";
    const label = svgEl("text", {
      x: num(x),
      y: String(padT + plotH + 18),
      fill: "#cbbba4",
      "font-size": "11",
      "text-anchor": anchor
    });
    label.textContent = formatCoins(hop);
    svg.append(label);
  });

  const yTitle = svgEl("text", {
    x: String(padL),
    y: "16",
    fill: "#cbbba4",
    "font-size": "12",
    "text-anchor": "start"
  });
  const currencies = [];
  lines.forEach(function (line) {
    const name = line.currency || "Coins";
    if (currencies.indexOf(name) === -1) currencies.push(name);
  });
  yTitle.textContent = currencies.length === 1 && currencies[0] !== "Coins" ? "Total profit (" + currencies[0] + ")" : "Total profit";
  svg.append(yTitle);
  const xTitle = svgEl("text", {
    x: String(padL + plotW / 2),
    y: String(viewH - 8),
    fill: "#cbbba4",
    "font-size": "12",
    "text-anchor": "middle"
  });
  xTitle.textContent = "Hops";
  svg.append(xTitle);

  lines.forEach(function (line) {
    let d = "";
    line.series.forEach(function (entry, index) {
      d += (index === 0 ? "M" : "L") + num(xOf(entry.hops)) + " " + num(yOf(entry.total));
    });
    svg.append(svgEl("path", {
      d: d,
      fill: "none",
      stroke: line.color,
      "stroke-width": "2",
      "stroke-linejoin": "round",
      "stroke-linecap": "round",
      "pointer-events": "none"
    }));
    if (line.series.length <= 40) {
      line.series.forEach(function (entry) {
        svg.append(svgEl("circle", {
          cx: num(xOf(entry.hops)),
          cy: num(yOf(entry.total)),
          r: "3.5",
          fill: line.color,
          "pointer-events": "none"
        }));
      });
    }
  });

  const guide = svgEl("line", {
    stroke: "#a6843d",
    "stroke-width": "1",
    "stroke-dasharray": "3 3",
    "pointer-events": "none",
    visibility: "hidden"
  });
  const markers = lines.map(function (line) {
    return svgEl("circle", {
      r: "5.5",
      fill: line.color,
      stroke: "#1b1612",
      "stroke-width": "2",
      "pointer-events": "none",
      visibility: "hidden"
    });
  });
  svg.append(guide);
  markers.forEach(function (marker) { svg.append(marker); });

  const wrap = document.createElement("div");
  wrap.className = "line-chart";
  if (lines.length > 1) {
    const legend = document.createElement("div");
    legend.className = "chart-legend";
    lines.forEach(function (line) {
      const button = document.createElement("button");
      button.type = "button";
      button.title = "Remove " + line.name + " from the chart";
      const swatch = document.createElement("i");
      swatch.style.setProperty("--swatch", line.color);
      swatch.setAttribute("aria-hidden", "true");
      button.append(swatch, document.createTextNode(line.name));
      button.addEventListener("click", function () { toggleShop(line.key); });
      legend.append(button);
    });
    wrap.append(legend);
  }
  const tip = document.createElement("div");
  tip.className = "line-tip";
  tip.hidden = true;
  const tipHops = document.createElement("strong");
  const tipItems = document.createElement("span");
  tip.append(tipHops, tipItems);
  wrap.append(svg, tip);

  const anchorSeries = lines[0].series;
  let active = -1;
  let frozen = false;
  function setFrozen(on) {
    frozen = on;
    wrap.classList.toggle("frozen", on);
    if (on) guide.removeAttribute("stroke-dasharray");
    else guide.setAttribute("stroke-dasharray", "3 3");
  }
  function hide() {
    if (frozen) return;
    active = -1;
    guide.setAttribute("visibility", "hidden");
    markers.forEach(function (marker) { marker.setAttribute("visibility", "hidden"); });
    tip.hidden = true;
  }
  function show(clientX) {
    const rect = svg.getBoundingClientRect();
    if (!rect.width) return;
    const x = ((clientX - rect.left) / rect.width) * viewW;
    const clamped = Math.min(padL + plotW, Math.max(padL, x));
    const hop = hopTo === hopFrom ? hopFrom : hopFrom + ((clamped - padL) / plotW) * (hopTo - hopFrom);
    let index = Math.round(hop) - hopFrom;
    if (index < 0) index = 0;
    if (index > anchorSeries.length - 1) index = anchorSeries.length - 1;
    const entry = anchorSeries[index];
    const px = xOf(entry.hops);
    guide.setAttribute("x1", num(px));
    guide.setAttribute("x2", num(px));
    guide.setAttribute("y1", String(padT));
    guide.setAttribute("y2", String(padT + plotH));
    guide.setAttribute("visibility", "visible");
    let topY = yOf(entry.total);
    lines.forEach(function (line, lineIndex) {
      const point = line.series[index] || line.series[line.series.length - 1];
      const py = yOf(point.total);
      if (py < topY) topY = py;
      const marker = markers[lineIndex];
      marker.setAttribute("cx", num(xOf(point.hops)));
      marker.setAttribute("cy", num(py));
      marker.setAttribute("visibility", "visible");
    });
    if (active !== index) {
      active = index;
      tipHops.textContent = hopLabel(entry.hops);
      tipItems.textContent = itemsEachHop(entry);
      while (tip.childNodes.length > 2) tip.removeChild(tip.lastChild);
      if (lines.length === 1) {
        const profit = document.createElement("span");
        const point = lines[0].series[index] || lines[0].series[lines[0].series.length - 1];
        profit.textContent = moneyNoun(point.total, lines[0].currency);
        tip.append(profit);
      } else {
        lines.forEach(function (line) {
          const point = line.series[index] || line.series[line.series.length - 1];
          const row = document.createElement("span");
          row.className = "tip-line";
          const swatch = document.createElement("i");
          swatch.style.setProperty("--swatch", line.color);
          row.append(swatch, document.createTextNode(line.name + " · " + moneyNoun(point.total, line.currency)));
          tip.append(row);
        });
      }
    }
    tip.hidden = false;
    const box = wrap.getBoundingClientRect();
    const localX = rect.left - box.left + (px / viewW) * rect.width;
    const localY = rect.top - box.top + (topY / viewH) * rect.height;
    const tw = tip.offsetWidth;
    const th = tip.offsetHeight;
    const margin = 8;
    const minLeft = margin - box.left;
    const maxLeft = window.innerWidth - margin - tw - box.left;
    const minTop = margin - box.top;
    const maxTop = window.innerHeight - margin - th - box.top;
    let left = localX + 14;
    if (left > maxLeft) left = localX - tw - 14;
    if (left < minLeft) left = minLeft;
    if (left > maxLeft) left = maxLeft;
    const above = localY - th - 12;
    const below = localY + 14;
    const aboveFits = above >= minTop && above <= maxTop;
    const belowFits = below >= minTop && below <= maxTop;
    let top = above;
    if (aboveFits) top = above;
    else if (belowFits) top = below;
    else top = Math.min(Math.max(above, minTop), maxTop);
    tip.style.left = left + "px";
    tip.style.top = top + "px";
  }

  svg.addEventListener("pointermove", function (event) {
    if (frozen) return;
    show(event.clientX);
  });
  svg.addEventListener("click", function (event) {
    if (frozen) {
      setFrozen(false);
      show(event.clientX);
      return;
    }
    show(event.clientX);
    setFrozen(true);
  });
  svg.addEventListener("pointerleave", function (event) {
    if (event.pointerType && event.pointerType !== "mouse") return;
    hide();
  });
  return wrap;
}

function shownSelection() {
  const selected = [];
  openShops.forEach(function (key) {
    const row = quotes.get(key);
    if (row) selected.push(row);
  });
  return selected;
}

function applySelectionStyles() {
  const selected = shownSelection();
  const colorOf = new Map();
  selected.forEach(function (row, index) {
    colorOf.set(row.shop.key, LINE_COLORS[index % LINE_COLORS.length]);
  });
  shopBody.querySelectorAll("tr").forEach(function (tr) {
    const color = colorOf.get(tr.dataset.shop) || "";
    const on = color !== "";
    tr.classList.toggle("selected", on);
    tr.setAttribute("aria-selected", on ? "true" : "false");
    if (on) tr.style.setProperty("--row-color", color);
    else tr.style.removeProperty("--row-color");
  });
}

function renderComparison(scroll) {
  const selected = shownSelection();
  shopDetail.replaceChildren();
  if (!selected.length) {
    shopDetail.hidden = true;
    return;
  }
  const heading = document.createElement("h3");
  if (selected.length === 1) {
    const shop = selected[0].shop;
    heading.textContent = shop.note ? shop.name + " " + shop.note : shop.name;
  } else {
    heading.textContent = "Comparing " + selected.length + " shops";
  }
  shopDetail.append(heading);
  const lines = [];
  const problems = [];
  selected.forEach(function (row, index) {
    const series = ensureSeries(row);
    if (!series) {
      problems.push(row.shop.name + ": " + (row.seriesError || "That sale is too large to total exactly."));
      return;
    }
    lines.push({
      key: row.shop.key,
      name: chartLabels.get(row.shop.key) || row.shop.name,
      series: series,
      currency: row.shop.currency,
      color: LINE_COLORS[index % LINE_COLORS.length]
    });
  });
  if (lines.length) shopDetail.append(renderLineChart(lines, selected[0].hopFrom, selected[0].hopTo));
  problems.forEach(function (text) {
    const err = document.createElement("p");
    err.textContent = text;
    shopDetail.append(err);
  });
  selected.forEach(function (row) {
    if (!row.quote || !row.quote.hitFloor) return;
    const floor = document.createElement("p");
    const where = moneyNoun(row.quote.lower, row.shop.currency);
    floor.textContent = selected.length === 1
      ? "The 10% floor was hit at " + where + "."
      : row.shop.name + " hits the 10% floor at " + where + ".";
    shopDetail.append(floor);
  });
  shopDetail.hidden = false;
  if (scroll) shopDetail.scrollIntoView({ block: "nearest" });
}

function depreciationKey(row) {
  const opts = row.priceOpts;
  return [opts.buyPercent, opts.deltaPercent, opts.baseStock, opts.currentStock].join("\u001f");
}

function tradeKey(row) {
  return row.rate.buy + "\u001f" + row.rate.delta;
}

function visibleShopRows() {
  const rows = tableRows.slice().sort(compareRows);
  if (!document.getElementById("hide-similar").checked) {
    rows.forEach(function (row) { row.hiddenSimilar = 0; });
    return rows;
  }
  const groups = new Map();
  rows.forEach(function (row) {
    const key = tradeKey(row);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(row);
  });
  const grouped = [];
  groups.forEach(function (group) {
    const row = group[0];
    row.hiddenSimilar = group.length - 1;
    row.similarNames = group.slice(1).map(function (other) { return other.shop.name; });
    grouped.push(row);
  });
  return grouped;
}

function addAllShops() {
  const groups = new Map();
  visibleShopRows().forEach(function (row) {
    const key = depreciationKey(row);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(row);
  });
  const keys = [];
  chartLabels = new Map();
  groups.forEach(function (group) {
    const row = group[0];
    keys.push(row.shop.key);
    if (group.length > 1) chartLabels.set(row.shop.key, row.shop.name + " · " + group.length + " shops");
  });
  if (!keys.length) return;
  shopChoice = true;
  openShops = keys;
  const wasHidden = shopDetail.hidden;
  applySelectionStyles();
  renderComparison(wasHidden);
}

function toggleShop(key) {
  shopChoice = true;
  const wasHidden = shopDetail.hidden;
  const index = openShops.indexOf(key);
  if (index === -1) openShops.push(key);
  else {
    openShops.splice(index, 1);
    chartLabels.delete(key);
  }
  applySelectionStyles();
  renderComparison(wasHidden);
}

function activeSortId() {
  if (sortKey === "hop") return "hop:" + sortHop;
  if (sortKey === "each") return "each";
  if (sortKey === "hopTo") return "hop:" + tableHopTo;
  return sortKey;
}

function applySort(key, hop) {
  const next = key === "hop" ? "hop:" + hop : key;
  if (next === activeSortId()) sortDir = -sortDir;
  else {
    sortKey = key;
    sortHop = hop || 0;
    sortDir = key === "shop" ? 1 : -1;
  }
  paintTable(false);
}

function headerCell(label, key, hop, note, title) {
  const th = document.createElement("th");
  const id = key === "hop" ? "hop:" + hop : key;
  const on = id === activeSortId();
  th.setAttribute("aria-sort", on ? (sortDir < 0 ? "descending" : "ascending") : "none");
  if (title) th.title = title;
  const button = document.createElement("button");
  button.type = "button";
  button.className = "sort";
  const row = document.createElement("span");
  row.className = "sort-label";
  const text = document.createElement("span");
  text.textContent = label;
  row.append(text);
  if (on) {
    const arrow = document.createElement("span");
    arrow.className = "sort-arrow";
    arrow.setAttribute("aria-hidden", "true");
    arrow.textContent = sortDir < 0 ? "↓" : "↑";
    row.append(arrow);
  }
  button.append(row);
  if (note) {
    const sub = document.createElement("span");
    sub.className = "th-note";
    sub.textContent = note;
    button.append(sub);
  }
  button.addEventListener("click", function () { applySort(key, hop); });
  th.append(button);
  return th;
}

function renderHead() {
  const tr = document.createElement("tr");
  const shopTh = headerCell("Shop", "shop", 0, "", "");
  shopTh.classList.add("shop-col");
  tr.append(shopTh);
  tr.append(headerCell("Buy", "buy", 0, "", ""));
  tr.append(headerCell("Change", "change", 0, "", ""));
  if (tableEach > 0) {
    const eachTh = headerCell(
      formatCoins(tableEach) + " each",
      "each",
      0,
      hopLabel(tableEachHops),
      eachHeaderTitle()
    );
    eachTh.classList.add("each-col");
    tr.append(eachTh);
  }
  tableHops.forEach(function (count) {
    const each = tableQuantity / count;
    tr.append(headerCell(
      hopLabel(count),
      "hop",
      count,
      formatCoins(each) + " each",
      "Coins for selling the whole stack in " + hopLabel(count) + ". Every hop sells " + itemNoun(each) + ", and every hop starts from the same stock."
    ));
  });
  document.getElementById("shop-head").replaceChildren(tr);
}

function spreadCoins(row, hops) {
  for (let i = 0; i < row.spreads.length; i++) {
    if (row.spreads[i].hops === hops) return row.spreads[i].total;
  }
  return 0;
}

function compareRows(a, b) {
  let diff = 0;
  if (sortKey === "shop") diff = a.shop.name.localeCompare(b.shop.name);
  else if (sortKey === "buy") diff = a.rate.buy - b.rate.buy;
  else if (sortKey === "change") diff = a.rate.delta - b.rate.delta;
  else if (sortKey === "hop") diff = spreadCoins(a, sortHop) - spreadCoins(b, sortHop);
  else if (sortKey === "each") diff = (a.eachSale ? a.eachSale.total : 0) - (b.eachSale ? b.eachSale.total : 0);
  else diff = a.hopToCoins - b.hopToCoins;
  if (diff !== 0) return diff * sortDir;
  if (sortKey !== "change" && a.rate.delta !== b.rate.delta) return a.rate.delta - b.rate.delta;
  const nameDiff = a.shop.name.localeCompare(b.shop.name);
  if (nameDiff !== 0) return nameDiff;
  return String(a.shop.key).localeCompare(String(b.shop.key));
}

function addSplitCell(tr, spread) {
  const td = document.createElement("td");
  td.className = "advice";
  const main = document.createElement("span");
  main.textContent = formatCoins(spread.total);
  const sub = document.createElement("span");
  sub.className = "advice-coins";
  sub.textContent = spread.each;
  td.title = spreadTitle(spread);
  td.append(main, sub);
  tr.append(td);
}

function shopsForSale() {
  const covered = coveredShopNames();
  const shops = [];
  SHOPS.forEach(function (shop) {
    if (generalStoreCovered(shop, covered)) return;
    shops.push(shop);
  });
  shopListings.forEach(function (shop) { shops.push(shop); });
  return shops;
}

function renderGeneral(shared) {
  const eachRead = readEachHop();
  const eachN = eachRead.error ? 0 : eachRead.value;
  const plan = eachN > 0 ? eachPlan(shared.quantity, eachN) : null;
  tableEach = plan ? plan.per : 0;
  tableEachHops = plan ? plan.hops : 0;
  tableEachFull = plan ? plan.full : 0;
  tableEachRem = plan ? plan.rem : 0;
  tableEachStack = plan ? shared.quantity : 0;
  tableQuantity = shared.quantity;
  if (pinEachSort && tableEach > 0) {
    sortKey = "each";
    sortDir = -1;
  }
  pinEachSort = false;
  if (tableEach === 0 && sortKey === "each") {
    sortKey = "hopTo";
    sortDir = -1;
  }
  const filter = document.getElementById("shop-filter").value.trim().toLowerCase();
  const rows = [];
  let overflow = "";
  shopsForSale().forEach(function (shop) {
    const haystack = (shop.name + " " + (shop.location || "") + " " + (shop.note || "") + " " + (shop.currency || "")).toLowerCase();
    if (filter && haystack.indexOf(filter) === -1) return;
    const rate = shopRate(shop, shared.gloves);
    const priceOpts = shop.listed
      ? {
        value: shared.value,
        buyPercent: rate.buy,
        deltaPercent: rate.delta,
        baseStock: shop.baseStock,
        currentStock: shop.baseStock
      }
      : {
        value: shared.value,
        buyPercent: rate.buy,
        deltaPercent: rate.delta,
        baseStock: 0,
        currentStock: shared.stock
      };
    const sale = buildSale(priceOpts, shared.quantity, shared.hops);
    if (sale.error) {
      overflow = sale.error;
      return;
    }
    let eachSale = null;
    if (eachN > 0) {
      eachSale = eachHopSale(priceOpts, shared.quantity, eachN);
      if (eachSale.error) {
        overflow = eachSale.error;
        return;
      }
    }
    rows.push({
      shop: shop,
      rate: rate,
      quote: sale.quote,
      plan: sale.plan,
      spreads: sale.spreads,
      eachSale: eachSale,
      total: shared.quantity,
      priceOpts: priceOpts,
      hopFrom: shared.hopFrom,
      hopTo: shared.hopTo,
      hopToCoins: (function () {
        const target = shared.hops.length ? shared.hops[shared.hops.length - 1] : shared.hopTo;
        for (let i = 0; i < sale.spreads.length; i++) {
          if (sale.spreads[i].hops === target) return sale.spreads[i].total;
        }
        return 0;
      })(),
      series: null
    });
  });
  if (overflow) {
    formError.textContent = overflow;
    clearOutputs();
    return;
  }
  tableRows = rows;
  tableHops = shared.hops.slice().reverse();
  tableHopTo = tableHops.length ? tableHops[0] : shared.hopTo;
  if (sortKey === "hop" && tableHops.indexOf(sortHop) === -1) {
    sortKey = "hopTo";
    sortDir = -1;
  }
  paintTable(true);
}

function paintTable(resetSelection) {
  const rows = visibleShopRows();
  if (document.getElementById("hide-similar").checked && shopChoice) {
    const visibleKeys = new Set(rows.map(function (row) { return row.shop.key; }));
    const representative = new Map();
    rows.forEach(function (row) { representative.set(tradeKey(row), row.shop.key); });
    const byKey = new Map();
    tableRows.forEach(function (row) { byKey.set(row.shop.key, row); });
    const next = [];
    const seen = new Set();
    openShops.forEach(function (key) {
      let keep = key;
      if (!visibleKeys.has(key)) {
        const row = byKey.get(key);
        keep = row ? representative.get(tradeKey(row)) : null;
      }
      if (keep && visibleKeys.has(keep) && !seen.has(keep)) {
        seen.add(keep);
        next.push(keep);
      }
    });
    openShops = next;
  }
  let bestCoins = -1;
  rows.forEach(function (row) {
    if (row.hopToCoins > bestCoins) bestCoins = row.hopToCoins;
  });
  let bestKey = null;
  let bestName = null;
  let bestDelta = Infinity;
  rows.forEach(function (row) {
    if (row.hopToCoins !== bestCoins) return;
    const nameDiff = bestName === null ? 1 : row.shop.name.localeCompare(bestName);
    const earlier = bestKey === null || nameDiff < 0 || (nameDiff === 0 && String(row.shop.key).localeCompare(String(bestKey)) < 0);
    if (bestKey === null || row.rate.delta < bestDelta || (row.rate.delta === bestDelta && earlier)) {
      bestKey = row.shop.key;
      bestName = row.shop.name;
      bestDelta = row.rate.delta;
    }
  });
  if (!shopChoice) {
    openShops = bestKey ? [bestKey] : [];
    chartLabels = new Map();
  }
  quotes = new Map();
  renderHead();
  shopBody.replaceChildren();
  rows.forEach(function (row) {
    quotes.set(row.shop.key, row);
    const tr = document.createElement("tr");
    tr.tabIndex = 0;
    tr.dataset.shop = row.shop.key;
    tr.addEventListener("click", function () { toggleShop(row.shop.key); });
    tr.addEventListener("keydown", function (event) {
      if (event.target.closest("a")) return;
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      toggleShop(row.shop.key);
    });
    const nameTd = document.createElement("td");
    nameTd.classList.add("shop-col");
    const nameBtn = document.createElement("a");
    nameBtn.className = "shop-name";
    nameBtn.href = shopUrl(row.shop);
    nameBtn.target = "_blank";
    nameBtn.rel = "noopener noreferrer";
    nameBtn.textContent = row.shop.name;
    nameBtn.title = "Wiki page for " + row.shop.name;
    nameBtn.addEventListener("click", function (event) { event.stopPropagation(); });
    nameTd.append(nameBtn);
    if (row.hiddenSimilar > 0) {
      const similar = document.createElement("span");
      similar.className = "floor-flag";
      similar.textContent = row.hiddenSimilar === 1
        ? "1 similar shop hidden"
        : formatCoins(row.hiddenSimilar) + " similar shops hidden";
      similar.title = row.similarNames.join(", ");
      nameTd.append(similar);
    }
    if (row.shop.listed) {
      const stockFlag = document.createElement("span");
      stockFlag.className = "floor-flag";
      const bits = [];
      bits.push(row.shop.unlimited ? "Unlimited stock" : "Stocks " + formatCoins(row.shop.baseStock));
      if (row.shop.note) bits.push(row.shop.note);
      if (row.shop.currency && row.shop.currency !== "Coins") bits.push(row.shop.currency);
      stockFlag.textContent = bits.join(" · ");
      nameTd.append(stockFlag);
    }
    if (row.shop.floorNote) {
      const flag = document.createElement("span");
      flag.className = "floor-flag";
      flag.textContent = "Listed at " + formatPercent(row.shop.buy) + ", below the 10% floor.";
      nameTd.append(flag);
    }
    tr.append(nameTd);
    addCell(tr, formatPercent(row.rate.buy) + (row.rate.gloves ? " gloves" : ""));
    addCell(tr, formatPercent(row.rate.delta));
    if (row.eachSale) {
      const eachTd = document.createElement("td");
      eachTd.className = "advice each-col";
      const eachMain = document.createElement("span");
      eachMain.textContent = formatCoins(row.eachSale.total);
      const eachSub = document.createElement("span");
      eachSub.className = "advice-coins";
      eachSub.textContent = hopLabel(row.eachSale.hops);
      eachTd.title = eachCellTitle(row.eachSale, row.shop.currency);
      eachTd.append(eachMain, eachSub);
      tr.append(eachTd);
    }
    tableHops.forEach(function (count) {
      const spread = row.spreads.find(function (item) { return item.hops === count; });
      addSplitCell(tr, spread);
    });
    shopBody.append(tr);
  });
  applySelectionStyles();
  if (resetSelection || shopDetail.hidden) renderComparison(false);
}

function addCell(tr, text) {
  const td = document.createElement("td");
  td.textContent = text;
  tr.append(td);
}

function updateAll() {
  syncHopSliders();
  renderPicked();
  updateShopStatus();
  syncEachError();
  const shared = readShared();
  if (shared.empty) {
    formError.textContent = "";
    clearOutputs();
    return;
  }
  if (shared.error) {
    formError.textContent = shared.error;
    clearOutputs();
    return;
  }
  formError.textContent = "";
  renderGeneral(shared);
}

function scheduleUpdate() {
  clearTimeout(calcTimer);
  calcTimer = setTimeout(updateAll, 60);
}

async function loadCatalog() {
  searchInput.disabled = true;
  searchInput.placeholder = "Loading items…";
  setStatus("Loading items from the wiki…", false);
  try {
    const response = await fetch(MAPPING_URL);
    if (!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();
    if (!Array.isArray(data)) throw new Error("Unexpected item list");
    catalog = data;
    searchInput.disabled = false;
    searchInput.placeholder = "Search by name or id";
    setStatus("Loaded " + formatCoins(catalog.length) + " items.", false);
    if (selected) {
      const fresh = catalog.find(function (item) { return item.id === selected.id; });
      selected = fresh || null;
      if (!selected) {
        searchInput.value = "";
        clearShopLookup();
      } else if (fresh.name !== shopListingName) {
        clearShopLookup();
        beginShopLookup(fresh);
      }
    }
  } catch (err) {
    catalog = [];
    selected = null;
    searchInput.disabled = true;
    searchInput.placeholder = "Item list unavailable";
    setStatus("Could not load the item list. Serve this page over http and use Reload items.", true);
  }
  updateAll();
}


searchInput.addEventListener("input", function () {
  if (!selected || searchInput.value !== selected.name) {
    if (selected || shopListingState !== "idle") clearShopLookup();
    selected = null;
    shopChoice = false;
    openShops = [];
  }
  activeIndex = -1;
  renderResults();
  scheduleUpdate();
});
searchInput.addEventListener("keydown", function (event) {
  const buttons = resultsEl.querySelectorAll("button");
  if (event.key === "ArrowDown") {
    event.preventDefault();
    if (resultsEl.hidden) renderResults();
    setActive(activeIndex + 1);
  } else if (event.key === "ArrowUp") {
    event.preventDefault();
    setActive(activeIndex - 1);
  } else if (event.key === "Enter") {
    event.preventDefault();
    if (!resultsEl.hidden && buttons.length > 0) {
      const index = activeIndex >= 0 ? activeIndex : 0;
      buttons[index].click();
    }
  } else if (event.key === "Escape") {
    resultsEl.hidden = true;
    searchInput.setAttribute("aria-expanded", "false");
  }
});
document.addEventListener("mousedown", function (event) {
  if (!event.target.closest(".search-wrap")) {
    resultsEl.hidden = true;
    searchInput.setAttribute("aria-expanded", "false");
  }
});
document.getElementById("reload").addEventListener("click", loadCatalog);
["quantity", "hops-from", "hops-to", "stock", "item-value", "shop-filter", "each-hop"].forEach(function (id) {
  document.getElementById(id).addEventListener("input", function () {
    if (id === "quantity") {
      quantityStillOpening = false;
      document.getElementById("hops-to").value = document.getElementById("quantity").value;
    }
    if (id === "each-hop") pinEachSort = true;
    syncHopSliders();
    scheduleUpdate();
  });
});
["hops-from", "hops-to"].forEach(function (id) {
  document.getElementById(id + "-slider").addEventListener("input", function () {
    applyHopSlider(id);
  });
});
document.getElementById("add-all-shops").addEventListener("click", addAllShops);
document.getElementById("hide-similar").addEventListener("change", function () {
  paintTable(true);
});
document.querySelectorAll("[data-gloves]").forEach(function (button) {
  button.addEventListener("click", function () {
    gloves = Number(button.getAttribute("data-gloves"));
    document.querySelectorAll("[data-gloves]").forEach(function (other) {
      other.setAttribute("aria-pressed", other === button ? "true" : "false");
    });
    updateAll();
  });
});
loadCatalog();
updateAll();
</script>
